[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harq-lab"
version = "1.0.0"
description = "Reproducible delay-aware HARQ research simulator"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "scipy>=1.13,<2", "matplotlib>=3.9,<4", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[project.scripts]
harq-lab = "harq_lab.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

