name: Verify HARQ research model
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12 --extra dev --locked
      - run: uv run pytest -q
      - run: uv run ruff check harq_lab tests
  electron:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12 --extra dev --locked
      - run: npm ci
      - run: npm run check
      - run: npm run test:charts
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-evidence
          path: |
            results/desktop-*.png
            test-results/
